    <script>
        var baseurl = "\/\/localhost:1313\/";
        
        
        $(document).ready(function() {
            
            initLunr();
            
            hljs.highlightAll();
            
            
            $('pre code').each(function() {
                var code = $(this);
                var btn = $('<button class="copy-btn" title="Copy to clipboard"><i class="fas fa-copy"></i></button>');
                code.parent().css('position', 'relative').prepend(btn);
                
                btn.on('click', function() {
                    var text = code.text();
                    navigator.clipboard.writeText(text).then(function() {
                        btn.html('<i class="fas fa-check"></i>');
                        setTimeout(function() {
                            btn.html('<i class="fas fa-copy"></i>');
                        }, 2000);
                    });
                });
            });
            
            
            $('#body img').each(function() {
                var img = $(this);
                img.css('cursor', 'pointer').on('click', function() {
                    var modal = $('<div class="image-modal"><img src="' + img.attr('src') + '"></div>');
                    $('body').append(modal);
                    modal.on('click', function() { modal.remove(); });
                });
            });
            
            
            $('#body h1, #body h2, #body h3, #body h4, #body h5, #body h6').filter('[id]').each(function() {
                var heading = $(this);
                var anchor = $('<a class="anchor-link" href="#' + heading.attr('id') + '"><i class="fas fa-link"></i></a>');
                heading.append(anchor);
            });
            
            
            var visitedLinks = JSON.parse(localStorage.getItem('visitedLinks') || '[]');
            visitedLinks.push(window.location.pathname);
            localStorage.setItem('visitedLinks', JSON.stringify([...new Set(visitedLinks)]));
            
            
            $('.topics a').each(function() {
                var link = $(this);
                var href = new URL(link.attr('href'), window.location.origin).pathname;
                if (visitedLinks.includes(href)) {
                    link.closest('li').addClass('visited');
                }
            });
            
            
            $('[data-clear-history-toggle]').on('click', function(e) {
                e.preventDefault();
                if (confirm('Clear all visited links history?')) {
                    localStorage.removeItem('visitedLinks');
                    $('.topics li').removeClass('visited');
                }
            });
            
            
            $('[data-search-clear]').on('click', function() {
                $('#search-by').val('').focus();
            });
            
            
            $('#sidebar-toggle-span').on('click', function() {
                $('#sidebar').toggleClass('active');
            });
        });
    </script>
