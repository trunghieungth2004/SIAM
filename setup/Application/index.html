<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIAM - Real-Time IoT Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>SIAM IoT Dashboard</h1>
                <div class="controls">
                    <button id="theme-toggle" class="theme-btn">Toggle Theme</button>
                    <button id="refresh-btn" class="refresh-btn">Refresh Now</button>
                    <button id="debug-btn" class="debug-btn">Export Debug Data</button>
                    <button id="swagger-btn" class="swagger-btn" onclick="window.location.href='swagger.html'">API Docs</button>
                    <span id="last-update" class="last-update">Last update: Never</span>
                </div>
            </div>
        </header>

        <main id="devices-container">
            <div class="loading">Loading devices...</div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
