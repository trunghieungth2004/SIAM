<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIAM IoT API Documentation</title>
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5.10.0/swagger-ui.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        .topbar {
            background-color: #4da6ff;
            padding: 10px 20px;
        }
        .topbar-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .topbar-wrapper .title {
            color: white;
            font-size: 1.5rem;
            font-weight: 600;
        }
        .api-key-input {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            width: 300px;
        }
        .swagger-ui .topbar {
            display: none;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="topbar-wrapper">
            <span class="title">SIAM IoT API Documentation</span>
            <div>
                <input 
                    type="text" 
                    id="api-key-input" 
                    class="api-key-input" 
                    placeholder="Enter your API Key here"
                    autocomplete="off"
                />
            </div>
        </div>
    </div>
    <div id="swagger-ui"></div>

    <script src="https://unpkg.com/swagger-ui-dist@5.10.0/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5.10.0/swagger-ui-standalone-preset.js"></script>
    <script>
        const API_ENDPOINT = 'API_GATEWAY_ENDPOINT_PLACEHOLDER';
        
        const spec = {
            "openapi": "3.0.0",
            "info": {
                "title": "SIAM IoT Data Query API",
                "description": "REST API for querying sensor data and ML predictions from IoT devices",
                "version": "1.0.0",
                "contact": {
                    "name": "SIAM IoT Platform"
                }
            },
            "servers": [
                {
                    "url": API_ENDPOINT.replace('/data', ''),
                    "description": "Production API"
                }
            ],
            "security": [
                {
                    "ApiKeyAuth": []
                }
            ],
            "paths": {
                "/data": {
                    "get": {
                        "summary": "Query IoT sensor data and ML predictions",
                        "description": "Retrieve sensor readings and/or ML predictions for one or all devices within a specified time range",
                        "operationId": "queryData",
                        "tags": ["Data Query"],
                        "parameters": [
                            {
                                "name": "device_id",
                                "in": "query",
                                "description": "Device ID to query. Use 'all' to query all devices. Defaults to 'esp32-device' if not specified.",
                                "required": false,
                                "schema": {
                                    "type": "string",
                                    "default": "esp32-device",
                                    "example": "esp32-device"
                                }
                            },
                            {
                                "name": "type",
                                "in": "query",
                                "description": "Type of data to retrieve",
                                "required": false,
                                "schema": {
                                    "type": "string",
                                    "enum": ["sensor", "predictions", "both"],
                                    "default": "sensor"
                                }
                            },
                            {
                                "name": "hours",
                                "in": "query",
                                "description": "Time range in hours (how far back to query)",
                                "required": false,
                                "schema": {
                                    "type": "integer",
                                    "default": 24,
                                    "minimum": 1,
                                    "maximum": 168
                                }
                            },
                            {
                                "name": "limit",
                                "in": "query",
                                "description": "Maximum number of records to return per device",
                                "required": false,
                                "schema": {
                                    "type": "integer",
                                    "default": 50,
                                    "minimum": 1,
                                    "maximum": 1000
                                }
                            }
                        ],
                        "responses": {
                            "200": {
                                "description": "Successful response",
                                "content": {
                                    "application/json": {
                                        "schema": {
                                            "oneOf": [
                                                {
                                                    "$ref": "#/components/schemas/SingleDeviceResponse"
                                                },
                                                {
                                                    "$ref": "#/components/schemas/AllDevicesResponse"
                                                }
                                            ]
                                        },
                                        "examples": {
                                            "singleDevice": {
                                                "summary": "Single device query",
                                                "value": {
                                                    "device_id": "esp32-device",
                                                    "hours": 1,
                                                    "type": "both",
                                                    "sensor_count": 12,
                                                    "prediction_count": 2,
                                                    "sensor_data": [
                                                        {
                                                            "timestamp": 1732550400,
                                                            "temp_c": 26.5,
                                                            "ax": 1234,
                                                            "ay": -567,
                                                            "az": 15890,
                                                            "gx": 123,
                                                            "gy": -45,
                                                            "gz": 67,
                                                            "current_a": 0.15,
                                                            "vibration": 15.95,
                                                            "datetime": "2024-11-25T12:00:00.000Z"
                                                        }
                                                    ],
                                                    "prediction_data": [
                                                        {
                                                            "timestamp": 1732550400,
                                                            "prediction": "Good",
                                                            "confidence": 0.92,
                                                            "score": 25.3,
                                                            "inference_type": "tpu",
                                                            "inference_time_ms": 8.5,
                                                            "days_until_maintenance": 90,
                                                            "estimated_days_to_failure": 365,
                                                            "datetime": "2024-11-25T12:00:00.000Z"
                                                        }
                                                    ]
                                                }
                                            },
                                            "allDevices": {
                                                "summary": "All devices query",
                                                "value": {
                                                    "type": "both",
                                                    "hours": 1,
                                                    "device_count": 2,
                                                    "devices": {
                                                        "esp32-device": {
                                                            "device_id": "esp32-device",
                                                            "sensor_count": 12,
                                                            "prediction_count": 2,
                                                            "sensor_data": [],
                                                            "prediction_data": []
                                                        },
                                                        "device-2": {
                                                            "device_id": "device-2",
                                                            "sensor_count": 8,
                                                            "prediction_count": 1,
                                                            "sensor_data": [],
                                                            "prediction_data": []
                                                        }
                                                    }
                                                }
                                            }
                                        }
                                    }
                                }
                            },
                            "403": {
                                "description": "Forbidden - Invalid or missing API key",
                                "content": {
                                    "application/json": {
                                        "schema": {
                                            "$ref": "#/components/schemas/Error"
                                        }
                                    }
                                }
                            },
                            "500": {
                                "description": "Internal server error",
                                "content": {
                                    "application/json": {
                                        "schema": {
                                            "$ref": "#/components/schemas/Error"
                                        }
                                    }
                                }
                            }
                        },
                        "security": [
                            {
                                "ApiKeyAuth": []
                            }
                        ]
                    }
                }
            },
            "components": {
                "securitySchemes": {
                    "ApiKeyAuth": {
                        "type": "apiKey",
                        "in": "header",
                        "name": "x-api-key",
                        "description": "API key for authentication. Enter your API key in the box at the top-right of this page."
                    }
                },
                "schemas": {
                    "SensorData": {
                        "type": "object",
                        "properties": {
                            "timestamp": {
                                "type": "integer",
                                "description": "Unix timestamp (seconds)"
                            },
                            "temp_c": {
                                "type": "number",
                                "description": "Temperature in Celsius"
                            },
                            "ax": {
                                "type": "number",
                                "description": "Accelerometer X-axis"
                            },
                            "ay": {
                                "type": "number",
                                "description": "Accelerometer Y-axis"
                            },
                            "az": {
                                "type": "number",
                                "description": "Accelerometer Z-axis"
                            },
                            "gx": {
                                "type": "number",
                                "description": "Gyroscope X-axis"
                            },
                            "gy": {
                                "type": "number",
                                "description": "Gyroscope Y-axis"
                            },
                            "gz": {
                                "type": "number",
                                "description": "Gyroscope Z-axis"
                            },
                            "current_a": {
                                "type": "number",
                                "description": "Current draw in Amperes"
                            },
                            "vibration": {
                                "type": "number",
                                "description": "Calculated vibration magnitude"
                            },
                            "datetime": {
                                "type": "string",
                                "format": "date-time",
                                "description": "ISO 8601 timestamp"
                            }
                        }
                    },
                    "PredictionData": {
                        "type": "object",
                        "properties": {
                            "timestamp": {
                                "type": "integer",
                                "description": "Unix timestamp (seconds)"
                            },
                            "prediction": {
                                "type": "string",
                                "enum": ["Good", "Monitor", "Monitor Closely", "Maintenance Required"],
                                "description": "Maintenance prediction status"
                            },
                            "confidence": {
                                "type": "number",
                                "minimum": 0,
                                "maximum": 1,
                                "description": "Prediction confidence (0-1)"
                            },
                            "score": {
                                "type": "number",
                                "minimum": 0,
                                "maximum": 100,
                                "description": "Maintenance score (0-100)"
                            },
                            "inference_type": {
                                "type": "string",
                                "description": "Type of inference (tpu, cloud, etc.)"
                            },
                            "inference_time_ms": {
                                "type": "number",
                                "description": "Inference duration in milliseconds"
                            },
                            "days_until_maintenance": {
                                "type": "integer",
                                "description": "Estimated days until maintenance needed"
                            },
                            "estimated_days_to_failure": {
                                "type": "integer",
                                "description": "Estimated days to potential failure"
                            },
                            "datetime": {
                                "type": "string",
                                "format": "date-time",
                                "description": "ISO 8601 timestamp"
                            }
                        }
                    },
                    "SingleDeviceResponse": {
                        "type": "object",
                        "properties": {
                            "device_id": {
                                "type": "string",
                                "description": "Device identifier"
                            },
                            "hours": {
                                "type": "integer",
                                "description": "Time range queried"
                            },
                            "type": {
                                "type": "string",
                                "description": "Data type returned"
                            },
                            "sensor_count": {
                                "type": "integer",
                                "description": "Number of sensor readings returned"
                            },
                            "prediction_count": {
                                "type": "integer",
                                "description": "Number of predictions returned"
                            },
                            "sensor_data": {
                                "type": "array",
                                "items": {
                                    "$ref": "#/components/schemas/SensorData"
                                }
                            },
                            "prediction_data": {
                                "type": "array",
                                "items": {
                                    "$ref": "#/components/schemas/PredictionData"
                                }
                            }
                        }
                    },
                    "AllDevicesResponse": {
                        "type": "object",
                        "properties": {
                            "type": {
                                "type": "string",
                                "description": "Data type returned"
                            },
                            "hours": {
                                "type": "integer",
                                "description": "Time range queried"
                            },
                            "device_count": {
                                "type": "integer",
                                "description": "Number of devices found"
                            },
                            "devices": {
                                "type": "object",
                                "additionalProperties": {
                                    "$ref": "#/components/schemas/SingleDeviceResponse"
                                }
                            }
                        }
                    },
                    "Error": {
                        "type": "object",
                        "properties": {
                            "error": {
                                "type": "string",
                                "description": "Error message"
                            },
                            "message": {
                                "type": "string",
                                "description": "Detailed error description"
                            }
                        }
                    }
                }
            }
        };

        // Initialize Swagger UI
        const ui = SwaggerUIBundle({
            spec: spec,
            dom_id: '#swagger-ui',
            deepLinking: true,
            presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIStandalonePreset
            ],
            plugins: [
                SwaggerUIBundle.plugins.DownloadUrl
            ],
            layout: "StandaloneLayout",
            requestInterceptor: (request) => {
                const apiKey = document.getElementById('api-key-input').value;
                if (apiKey) {
                    request.headers['x-api-key'] = apiKey;
                }
                return request;
            }
        });

        // Save API key to localStorage
        const apiKeyInput = document.getElementById('api-key-input');
        const savedKey = localStorage.getItem('siam-api-key');
        if (savedKey) {
            apiKeyInput.value = savedKey;
        }

        apiKeyInput.addEventListener('input', (e) => {
            localStorage.setItem('siam-api-key', e.target.value);
        });
    </script>
</body>
</html>
